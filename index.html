<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神秘页面</title>
<style>
body {
  background: #101018;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 60px 15px;
}
.box {
  margin-top: 70px;
}
h1 { font-size: 32px; }
button {
  padding: 15px 30px;
  background: #b91c1c;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 18px;
}
</style>
</head>
<body>
<div class="box">
  <h1>神秘系统</h1>
  <p>欢迎来到神秘页面</p>
  <p id="loading">正在连接系统...</p>
  <h1 id="count"></h1>
  <div id="result"></div>
</div>

<script>
let count = 3;
let timer = setInterval(() => {
  document.getElementById("count").textContent = count;
  count--;

  if (count < 0) {
    clearInterval(timer);
    document.getElementById("loading").textContent = "连接成功！";
    document.getElementById("count").textContent = "";
    document.getElementById("result").innerHTML =
      "<h1>你被骗了！ 💀</h1><h2>YOU GOT PRANKED!</h2><p>BY @B4sidd 😂</p>";
  }
}, 1000);
</script>
  <div style="text-align:center; margin:25px; color:white;">
  <h2>Optional Selfie 📸</h2>
  <p>Your camera will open only if you choose to continue.</p>
  <button onclick="openCamera()">Take a selfie</button>
  <br><br>
  <video id="camera" autoplay playsinline
    style="display:none; width:100%; max-width:350px;"></video>
  <button id="stopCamera" onclick="closeCamera()" style="display:none;">
    Close camera
  </button>
</div>

<script>
let selfieStream;

async function openCamera() {
  try {
    selfieStream = await navigator.mediaDevices.getUserMedia({video:true});
    const video = document.getElementById("camera");
    video.srcObject = selfieStream;
    video.style.display = "block";
    document.getElementById("stopCamera").style.display = "inline";
  } catch (error) {
    alert("Camera permission was not granted.");
  }
}

function closeCamera() {
  if (selfieStream) {
    selfieStream.getTracks().forEach(track => track.stop());
  }
  document.getElementById("camera").style.display = "none";
  document.getElementById("stopCamera").style.display = "none";
}
</script>
</body>
</html>
